# Render Blueprint Specification for Smart Campus Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-campus-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: https://smart-campus-frontend-chi.vercel.app,http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

databases:
  - name: smart-campus-postgres
    plan: free
    region: oregon
    databaseName: campus
    user: campus_user
