server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/campus
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
app:
  jwt:
    secret: change-this-secret-to-at-least-32-characters-long-please
    expiration-ms: 86400000
  cors-origin: http://localhost:5173
